<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beautiful HTML Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.85);
            padding: 40px 30px;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.2);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #3a7bd5;
            margin-bottom: 16px;
            font-size: 2.5em;
        }
        p {
            color: #555;
            font-size: 1.2em;
            margin-bottom: 24px;
        }
        .btn {
            background: linear-gradient(90deg, #3a7bd5 0%, #00d2ff 100%);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 2px 8px rgba(58,123,213,0.15);
        }
        .btn:hover {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>This is a beautiful HTML page designed with modern styles and gradients. Enjoy the clean and elegant look!</p>
        <button class="btn">Get Started</button>
    </div>
</body>
